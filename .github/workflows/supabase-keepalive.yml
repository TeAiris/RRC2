# Keeps the free Supabase project from pausing after a week without use.
# Every 3 days it reads one row from the public `rhythms` table, which counts as database activity.
# The URL and publishable key are the same public values as in tokens.js.
# GitHub pauses scheduled workflows in a repository with no commits for 60 days; re-enable it under Actions if that happens.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one rhythm
        env:
          SUPABASE_URL: https://qbnatagqeeboolqpucoj.supabase.co
          SUPABASE_KEY: sb_publishable___3cJ-NTKOedR1B7HxLygQ_fHp-H69w
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_KEY" "$SUPABASE_URL/rest/v1/rhythms?select=id&limit=1")
          echo "Supabase answered $code"
          test "$code" = "200"
